name: Validate agent assets

on:
  push:
    paths:
      - '.claude/commands/**'
      - '.github/skills/**'
      - 'scripts/agent-assets.js'
      - 'package.json'
      - '.github/workflows/agent-assets.yml'
  pull_request:
    paths:
      - '.claude/commands/**'
      - '.github/skills/**'
      - 'scripts/agent-assets.js'
      - 'package.json'
      - '.github/workflows/agent-assets.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and generate catalog
        run: npm run agents:update

  update-catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate catalog
        run: npm run agents:update
      - name: Commit generated catalog on push
        run: |
          if git diff --quiet -- .github/agent-assets.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/agent-assets.json
          git commit -m "chore: update agent and skill catalog"
          git push
