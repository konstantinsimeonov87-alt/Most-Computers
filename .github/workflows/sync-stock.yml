name: Sync Stock from Most BG XML

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync stock from XML feeds
        run: node scripts/sync-stock.js

      - name: Sync prices and detect discounts
        run: node scripts/sync-prices.js

      - name: Refresh promotions feed
        run: node scripts/fetch-promotions.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet js/data.js js/promotions-data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild
        if: steps.changes.outputs.changed == 'true'
        run: node build.js

      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js js/promotions-data.js app.js dist/app.js dist/js/promotions-data.js dist/sw.js price-history.json
          git commit -m "chore(stock): auto-sync stock+prices+promos $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows (GitHub
      # platform restriction, separate from [skip ci]) - build-deploy.yml
      # would never fire for this commit, so deploy directly here instead.
      - name: Deploy to gh-pages
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd dist
          echo "most-computers.com" > CNAME
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: minified deploy from ${GITHUB_SHA:0:7} [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
